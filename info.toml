format_version = 1

welcome_message = """
Is this your first time? Don't worry, cpplings is made for beginners!
We are going to teach you a lot of things about C++, but before we can
get started, here are some notes about how cpplings operates:

1. The central concept behind cpplings is that you solve exercises. These
   exercises usually contain some compiler or logic errors which cause the
   exercise to fail compilation or testing. It's your job to find all errors
   and fix them!
2. Make sure to have your editor open in the `cpplings/` directory. cpplings
   will show you the path of the current exercise under the progress bar. Open
   the exercise file in your editor, fix errors and save the file. cpplings
   will automatically detect the file change and rerun the exercise. If all
   errors are fixed, cpplings will ask you to move on to the next exercise.
3. If you're stuck on an exercise, enter `h` to show a hint.
4. The exercises are compiled with `c++` (set the CXX environment variable to
   use another compiler) in C++23 mode with warnings, bounds-checked standard
   containers and sanitizers where available. If you use clangd, it picks up
   the compiler flags from the generated `compile_commands.json`."""

final_message = """
We hope you enjoyed learning about the various aspects of C++!
Keep going: write small programs of your own, read code written by others and
keep cppreference.com close at hand. https://en.cppreference.com/w/cpp"""

# INTRO

[[exercises]]
name = "intro1"
dir = "00_intro"
skip_check_unsolved = true
hint = """
Enter `n` to move on to the next exercise.
You might need to press ENTER after typing `n`."""

[[exercises]]
name = "intro2"
dir = "00_intro"
hint = """
The compiler is informing us that `std::cout` wasn't declared. Every part of the
standard library lives in a header that must be included first. The compiler
also suggests which header provides `std::cout`."""

# VARIABLES

[[exercises]]
name = "variables1"
dir = "01_variables"
hint = """
A variable is declared by writing its type followed by its name: `int x = 5;`
You can also let the compiler deduce the type with `auto x = 5;`"""

[[exercises]]
name = "variables2"
dir = "01_variables"
hint = """
`auto` means "use the type of the initializer". Without an initializer, there is
nothing to deduce the type from. Try `auto x = 10;` and then another value to see
both branches of the `if`."""

[[exercises]]
name = "variables3"
dir = "01_variables"
hint = """
`const` promises that the variable never changes after its initialization. The
program assigns a new value later, so remove `const`."""

[[exercises]]
name = "variables4"
dir = "01_variables"
hint = """
A variable declared inside `{ }` is destroyed at the closing brace. Declare `bonus`
before the block, next to `attempts`, so it is still alive afterwards."""

[[exercises]]
name = "variables5"
dir = "01_variables"
hint = """
Unlike some languages, C++ doesn't allow declaring the same name twice in one
scope. But a nested block `{ ... }` opens a new scope where `number` can be
declared again, hiding the outer variable until the block ends."""

[[exercises]]
name = "variables6"
dir = "01_variables"
hint = """
Mark the function with `constexpr`:
    constexpr int number_of_slots() { ... }
Then the compiler is allowed to call it while compiling."""

[[exercises]]
name = "variables7"
dir = "01_variables"
hint = """
`int` only holds whole numbers, so `19.99` would be truncated to `19`. With braces
the compiler reports this "narrowing conversion" as an error. `double` holds
floating-point numbers."""

[[exercises]]
name = "variables8"
dir = "01_variables"
hint = """
After `left = right;`, the old value of `left` is gone. Keep a copy in a third
variable first:
    int saved = left;
Then use `saved` where the old value of `left` is needed."""

[[exercises]]
name = "variables9"
dir = "01_variables"
hint = """
`auto` takes the type of the initializer. `0` is an `int`, so `distance` is an
`int` and adding `2.5` to it drops the fractional part. Initialize it with a
`double` literal like `0.0` instead."""

# FUNCTIONS

[[exercises]]
name = "functions1"
dir = "02_functions"
hint = """
The function `main` calls a function named `call_me` which doesn't exist yet.
Define it above `main`:
    void call_me() {
        // ...
    }"""

[[exercises]]
name = "functions2"
dir = "02_functions"
hint = """
Every parameter needs a type. `num` is used as a count in the loop, so an integer
type like `int` fits."""

[[exercises]]
name = "functions3"
dir = "02_functions"
hint = """
This time, the function *declaration* is okay, but there's something wrong with
the place where the function is being called. `call_me` needs an `int`.
Bonus: default arguments like `void call_me(int num = 3)` make the argument
optional."""

[[exercises]]
name = "functions4"
dir = "02_functions"
hint = """
The error message says that a type is missing. Every function declaration starts
with its return type. The function returns a price, so `int` fits.
`auto` also works: the compiler deduces the return type from the `return`
statements."""

[[exercises]]
name = "functions5"
dir = "02_functions"
hint = """
`num * num;` computes a value and throws it away. The function never returns
anything, which is undefined behavior for a function declared to return `int`.
cpplings compiles with the undefined behavior sanitizer, which stops the program.
Use a `return` statement."""

[[exercises]]
name = "functions6"
dir = "02_functions"
hint = """
Put a declaration of `greet` above `main`. It looks like the first line of the
definition, ending with a semicolon instead of a body:
    void greet(const char* name);"""

[[exercises]]
name = "functions7"
dir = "02_functions"
hint = """
This is called overloading. Define another function with the same name and
different parameter types:
    double add(double a, double b) { ... }
The compiler picks the one that fits the arguments of each call."""

[[exercises]]
name = "functions8"
dir = "02_functions"
hint = """
A default argument is written after the parameter:
    std::string_view punctuation = "!"
Only trailing parameters can have defaults."""

[[exercises]]
name = "functions9"
dir = "02_functions"
hint = """
A recursive function needs a base case that returns without calling itself.
Here, that is `0! = 1`. Check for it with an `if` before the recursive call."""

# IF

[[exercises]]
name = "if1"
dir = "03_if"
hint = """
Use an `if` statement to compare `a` and `b`, and `return` the bigger one. The
compiler warns that the function doesn't return anything yet."""

[[exercises]]
name = "if2"
dir = "03_if"
hint = """
First, `1` isn't a string, so it can't be converted to `std::string_view`. Then,
look at the tests: "potato" needs its own branch. Use `else if`:
    if (...) {
        ...
    } else if (...) {
        ...
    } else {
        ...
    }"""

[[exercises]]
name = "if3"
dir = "03_if"
hint = """
In `condition ? a : b`, both `a` and `b` must have a common type. The last
alternative is a string while the others are integers. Replace it with an
integer that isn't handled by the `if` statements below, for example `4`."""

[[exercises]]
name = "switch1"
dir = "03_if"
hint = """
Every `case` that should stop needs a `break;`. Without it, the program continues
executing the statements of the next case ("fallthrough"). The compiler warns
"this statement may fall through"."""

[[exercises]]
name = "if4"
dir = "03_if"
hint = """
Translate the rule piece by piece: "divisible by 4 and not by 100" or
"divisible by 400". `&&` binds more tightly than `||`, but parentheses make the
intent clear:
    (A && B) || C"""

[[exercises]]
name = "if5"
dir = "03_if"
hint = """
`unread = 0` assigns 0 to `unread`, and the result of the assignment, 0, is
used as the condition, which is false. Comparison is written with `==`."""

[[exercises]]
name = "switch2"
dir = "03_if"
hint = """
Labels can be stacked on top of each other so that they share the statements
below:
    case 'a':
    case 'e':
        return true;"""

[[exercises]]
name = "quiz1"
dir = "quizzes"
hint = "No hints this time ;)"

# LOOPS

[[exercises]]
name = "loops1"
dir = "04_loops"
hint = """
The loop looks like this:
    while (n != 1) {
        ...
    }
Inside, use an `if` to tell even and odd numbers apart (`n % 2 == 0`), update
`n` and increase `steps`."""

[[exercises]]
name = "loops2"
dir = "04_loops"
hint = """
The condition decides whether another iteration runs, so it should be true as
long as `i` is at least 1: `i > 0`. The step runs after every iteration and
should count down: `--i`."""

[[exercises]]
name = "loops3"
dir = "04_loops"
hint = """
For `n = 1`, the loop should run once with `i = 1`. With `i < n`, it doesn't run
at all. The last value of `i` must be `n` itself, so the condition should be
`i <= n`."""

[[exercises]]
name = "loops4"
dir = "04_loops"
hint = """
`break;` leaves the innermost loop immediately. `continue;` jumps to the next
iteration, skipping the rest of the body. Write each at the TODO."""

[[exercises]]
name = "loops5"
dir = "04_loops"
hint = """
A `do`-`while` loop has its condition at the end:
    do {
        ...
    } while (condition);
Note the semicolon after the condition."""

# PRIMITIVE TYPES

[[exercises]]
name = "primitive_types1"
dir = "05_primitive_types"
hint = """
The negation of a `bool` is written with `!`:
    bool is_evening = !is_morning;"""

[[exercises]]
name = "primitive_types2"
dir = "05_primitive_types"
hint = """
Check whether `letter` is between 'a' and 'z' with `>=` and `<=`. The distance
between a lowercase letter and 'a' is the same as between its uppercase version
and 'A', so `letter - 'a' + 'A'` gives the uppercase letter.
The arithmetic produces an `int`; convert it back with `static_cast<char>(...)`."""

[[exercises]]
name = "primitive_types3"
dir = "05_primitive_types"
hint = """
There are several ways to create a C array with 100 elements:
    int a[100];       // uninitialized values
    int a[100] = {};  // all zero
    int a[] = {1, 2, 3, ...};  // size taken from the list
`std::size` returns the number of elements of an array."""

[[exercises]]
name = "primitive_types4"
dir = "05_primitive_types"
hint = """
`a + b` and `2` are both integers, so the division is an integer division and
the fractional part is dropped before the result is converted to `double`.
Make one of the operands a floating-point number, e.g. `2.0` or
`static_cast<double>(a + b)`."""

[[exercises]]
name = "primitive_types5"
dir = "05_primitive_types"
hint = """
The compiler warns that the comparison is always true. An unsigned number is
never negative: `20u - 30u` wraps around to a huge positive number. Compare the
two values directly instead of subtracting."""

[[exercises]]
name = "primitive_types6"
dir = "05_primitive_types"
hint = """
Overflowing a signed integer is undefined behavior, which the sanitizer catches.
Include <cstdint> and use `std::int64_t` for the parameter and the return type.
The multiplication then happens in 64 bits."""

[[exercises]]
name = "primitive_types7"
dir = "05_primitive_types"
hint = """
A structured binding declares several variables at once from the members of a
pair, tuple or struct:
    auto [first, second] = some_pair;"""

[[exercises]]
name = "primitive_types8"
dir = "05_primitive_types"
hint = """
Tuple elements are accessed with `std::get<INDEX>(tuple)`. The index goes between
the angle brackets because it must be known at compile time."""

[[exercises]]
name = "primitive_types9"
dir = "05_primitive_types"
hint = """
Compare the distance between the two numbers with a small tolerance:
    std::abs(a - b) < 1e-9
`std::abs` for floating-point numbers comes from <cmath>."""

[[exercises]]
name = "primitive_types10"
dir = "05_primitive_types"
hint = """
`a | b` turns on every bit that is on in `a` or in `b`. `a & b` keeps only the
bits that are on in both. If `permissions & wanted` equals `wanted`, all wanted
bits are on."""

[[exercises]]
name = "primitive_types11"
dir = "05_primitive_types"
hint = """
`std::lround` from <cmath> rounds to the nearest integer, halves away from
zero, and returns a `long`."""

# VECTORS

[[exercises]]
name = "vectors1"
dir = "06_vectors"
hint = """
Both `std::array` and `std::vector` can be initialized from a braced list of
values: `{10, 20, 30, 40}`. A vector can also be created from any range of
elements, e.g. `std::vector<int> v(a.begin(), a.end());`."""

[[exercises]]
name = "vectors2"
dir = "06_vectors"
hint = """
In the first function, use `output.push_back(...)` to append an element.

In the second function, `auto element` is a copy of each element. Changing the
copy doesn't change the vector. Use a reference instead: `auto& element`."""

[[exercises]]
name = "vectors3"
dir = "06_vectors"
hint = """
A vector with 4 elements has the indices 0, 1, 2 and 3. The loop condition
`i <= numbers.size()` also visits index 4. Use `<` instead, or avoid indices
completely with a range-based for loop."""

[[exercises]]
name = "vectors4"
dir = "06_vectors"
hint = """
A range-based for loop uses iterators into the vector, and `push_back` can
invalidate all of them. Remember the original size first and loop with an index:
    const std::size_t original_size = numbers.size();
    for (std::size_t i = 0; i < original_size; ++i) { ... numbers[i] ... }"""

[[exercises]]
name = "vectors5"
dir = "06_vectors"
hint = """
`std::erase_if(numbers, is_odd)` removes all elements for which `is_odd`
returns true, without any loop in your code. If you'd rather keep the loop, use
the iterator that `erase` returns and only increment `it` when nothing was
erased:
    it = numbers.erase(it);"""

[[exercises]]
name = "vectors6"
dir = "06_vectors"
hint = """
`reserve` allocates memory for at least `count` elements, but the vector still
has size 0, so `result[i]` is out of bounds. Add the elements with `push_back`,
which uses the reserved memory without reallocating."""

[[exercises]]
name = "vectors7"
dir = "06_vectors"
hint = """
A vector can be created with a number of copies of a value:
    std::vector<char>(columns, '.')
is one row. Pass such a row as the second argument when creating `board`."""

# REFERENCES AND POINTERS

[[exercises]]
name = "references1"
dir = "07_references"
hint = """
`std::vector<int> scores` is a copy of the caller's vector. The function adds the
bonus to the copy, which is destroyed at the end of the function. Take the
parameter by reference: `std::vector<int>& scores`."""

[[exercises]]
name = "references2"
dir = "07_references"
hint = """
The string literal "pointer" is converted to a temporary `std::string`. A
non-const reference refuses to bind to a temporary, because changes to it would
be lost. The function only reads the text, so make it a `const std::string&`."""

[[exercises]]
name = "references3"
dir = "07_references"
hint = """
Local variables are destroyed when the function returns. Return the string by
value instead of by reference: change the return type to `std::string`. This
doesn't create an expensive copy; the string is moved or built in place."""

[[exercises]]
name = "pointers1"
dir = "07_references"
hint = """
`*a` is the int that `a` points to. You can read and assign through it:
    int temp = *a;
    *a = ...;
You need a temporary variable to not lose one of the values."""

[[exercises]]
name = "pointers2"
dir = "07_references"
hint = """
Compare the pointer with `nullptr` before using it and return 0 in that case.
`name->size()` is a shorter way of writing `(*name).size()`."""

[[exercises]]
name = "pointers3"
dir = "07_references"
hint = """
Change the parameter to `std::span<const int> numbers` (include <span>). A span
knows its number of elements: use `numbers.size()`, or loop over it with a
range-based for loop."""

# STRUCTS AND CLASSES

[[exercises]]
name = "structs1"
dir = "08_structs"
hint = """
Data members are declared like variables inside the struct: `int red;`
A struct without constructors can be initialized from a braced list in the order
of its members, `Color green{0, 255, 0};`, or with designated initializers,
`Point point{.x = 1.5, .y = -2.0};`."""

[[exercises]]
name = "structs2"
dir = "08_structs"
hint = """
Reorder the designated initializers so they match the order of the members in
`Order`: `.made_by_email` comes before `.item_number`.

For your order, copy the template with `Order your_order = order_template;` and
then assign the members that differ."""

[[exercises]]
name = "structs3"
dir = "08_structs"
hint = """
A member function that doesn't modify the object should be marked `const` after
its parameter list: `bool is_international() const { ... }`. Only const member
functions can be called on const objects.

Inside member functions, the members can be used directly by their names, like
`sender_country`."""

[[exercises]]
name = "classes1"
dir = "08_structs"
hint = """
Add `public:` before the constructor. Everything after it is public until another
access specifier like `private:` appears. A common layout is the public interface
first and the private data at the end of the class."""

[[exercises]]
name = "classes2"
dir = "08_structs"
hint = """
`bool operator==(const Vec2&) const = default;` inside the struct asks the
compiler to compare all members.

Operators are functions with special names:
    Vec2 operator+(Vec2 a, Vec2 b) { return {...}; }
    Vec2 operator*(Vec2 v, double factor) { ... }"""

# ENUMS

[[exercises]]
name = "enums1"
dir = "09_enums"
hint = """
List the names used in `describe` inside the braces, separated by commas:
    enum class Message { Resize, Move, ... };"""

[[exercises]]
name = "enums2"
dir = "09_enums"
strict = true
hint = """
The compiler reports that `Direction::West` isn't handled in the switch, and that
the function can reach its end without returning anything. Add the missing case.

Even with every case handled, the compiler can't be sure that `direction` holds
one of the named values. After the switch, `std::unreachable();` from <utility>
tells it that this point is never reached.

Write `turn_right` with a switch as well."""

[[exercises]]
name = "enums3"
dir = "09_enums"
hint = """
`std::visit` calls the lambda that accepts the alternative currently stored in
the variant. Add one lambda per alternative to `Overloaded{...}`:
    [&](const Move& move) { x = move.x; y = move.y; },
`[&]` lets the lambda change the members of the state.
The generic lambda `[&](const auto&) {}` accepts every alternative that has no
lambda of its own. Once every alternative is handled, remove it: then forgetting
an alternative in the future becomes a compiler error."""

[[exercises]]
name = "enums4"
dir = "09_enums"
hint = """
Convert explicitly: `std::to_underlying(priority)` from <utility>, or
`static_cast<int>(priority)`.

`: std::uint8_t` after the enum name sets the underlying type, which decides the
size of the enum."""

[[exercises]]
name = "enums5"
dir = "09_enums"
hint = """
Turn both enums into scoped enums with `enum class`. Their values then live in
the enum's own scope and don't collide. The rest of the code already uses the
qualified names like `TrafficLight::Red`."""

[[exercises]]
name = "enums6"
dir = "09_enums"
hint = """
`std::holds_alternative<std::string>(reading)` tells whether the variant
currently holds a string. Only then is `std::get<std::string>(reading)` safe.
Alternatively, `std::get_if` returns a pointer that is null for the wrong
alternative."""

# STRINGS

[[exercises]]
name = "strings1"
dir = "10_strings"
hint = """
At least one side of `+` must be a `std::string`:
    std::string greeting = std::string("Hello, ") + "world!";
With `using namespace std::string_literals;`, the suffix `s` turns a literal into
a `std::string`: `"Hello, "s`."""

[[exercises]]
name = "strings2"
dir = "10_strings"
hint = """
`word` and "green" are both pointers to characters. `==` compares the pointers,
which point to different places in memory even if the text is equal.
Change the parameter to `std::string_view` (include <string_view>). A string view
compares the characters, and a `const char*` converts to it."""

[[exercises]]
name = "strings3"
dir = "10_strings"
hint = """
Useful member functions of `std::string_view` and `std::string`:
- `find_first_not_of(" \\t\\n")` and `find_last_not_of(...)` for trimming
- `substr(position, length)`
- `find(text, start)` returns `npos` when nothing is found
- `replace(position, length, new_text)` (only on `std::string`)
A `std::string` can be created from a view: `std::string(input)`."""

[[exercises]]
name = "strings4"
dir = "10_strings"
hint = """
`{:.2f}` formats a floating-point number with 2 digits after the decimal point.
`{:<10}` pads to a width of 10 and aligns left, `{:>4}` aligns right.
Everything outside the braces is copied as is:
    std::format("${:.2f}", price)"""

[[exercises]]
name = "strings5"
dir = "10_strings"
hint = """
A `std::string_view` doesn't own any characters. When the function returns,
`text` is destroyed and the view points to freed memory. Return `std::string`
instead, so the caller gets its own copy."""

[[exercises]]
name = "strings6"
dir = "10_strings"
hint = """
`line.find('=')` returns the position of the first '='. `line.substr(0, pos)`
is everything before it and `line.substr(pos + 1)` everything after it. Handle
`std::string_view::npos` separately."""

[[exercises]]
name = "strings7"
dir = "10_strings"
hint = """
`std::string_view` (and `std::string`) have `starts_with` and `ends_with`
since C++20. Both accept a string or a single character."""

