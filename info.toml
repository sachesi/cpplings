[[exercises]]
name = "namespaces1"
dir = "11_namespaces"
hint = """
`make_sausage` is declared inside the namespace `sausage_factory`. Outside of it,
the name must be qualified: `sausage_factory::make_sausage()`."""

[[exercises]]
name = "namespaces2"
dir = "11_namespaces"
hint = """
A namespace alias looks like this:
    namespace short_name = some::long::name;
A using declaration brings one name into scope:
    using some::long::name::THING;"""

[[exercises]]
name = "namespaces3"
dir = "11_namespaces"
hint = """
Add `using namespace std::chrono_literals;` inside `main` (or above it). Durations
