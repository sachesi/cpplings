# MAPS

[[exercises]]
name = "maps1"
dir = "12_maps"
hint = """
The key is the name of a fruit (`std::string`) and the value is a count (`int`):
    std::unordered_map<std::string, int> basket;
Add fruits the same way as the bananas."""

[[exercises]]
name = "maps2"
dir = "12_maps"
hint = """
`basket[fruit] = 1` overwrites existing counts. Only insert when the key is
missing. `basket.try_emplace(fruit, 1)` does exactly that, or check first with
`basket.contains(fruit)`."""

[[exercises]]
name = "maps3"
dir = "12_maps"
hint = """
`scores[name]` returns a reference to the entry for `name`, creating a
zero-initialized `TeamScores` if the team isn't in the table yet. Keep the
reference in a variable and add to its members:
    TeamScores& team_1 = scores[team_1_name];"""

[[exercises]]
name = "maps4"
dir = "12_maps"
hint = """
`operator[]` inserts missing keys, so it can't be used on a const map. `find`
returns an iterator to the entry, or `end()` if the key doesn't exist. The
iterator points to a pair: `it->first` is the key, `it->second` the value.
`inventory.at(item)` doesn't insert either, but throws for unknown keys."""

