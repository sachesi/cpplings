name = "quiz2"
dir = "quizzes"
hint = "No hints this time ;)"

# OPTIONAL

[[exercises]]
name = "optional1"
dir = "13_optional"
hint = """
Returning a plain value from a function that returns `std::optional<int>` wraps
it in the optional. `return std::nullopt;` returns an empty optional.

In the test, an optional doesn't convert to `int` on its own. `value()` returns
the contained value (and throws if there is none); `*` returns it without
checking."""

[[exercises]]
name = "optional2"
dir = "13_optional"
hint = """
`value_or(fallback)` returns the contained value, or the fallback if the optional
is empty. The fallback must have the same type as the value, so convert the name:
`std::string(name)`.

An optional can be used as a condition, true if it holds a value. With an `if`
initializer, the variable only exists inside the `if`:
    if (auto nickname = find_nickname(name)) { ... }"""

[[exercises]]
name = "optional3"
dir = "13_optional"
hint = """
`parse_int(text)` returns an optional. `.and_then(half)` calls `half` with the
number if there is one; `half` returns an optional itself. Finally,
`.transform(...)` turns the number into a string with a lambda:
    [](int n) { return "half is " + std::to_string(n); }"""

# ERROR HANDLING

[[exercises]]
name = "errors1"
dir = "14_error_handling"
hint = """
`throw` creates an exception object and leaves the function:
    throw std::invalid_argument("...");
The constructor argument is the message returned by `what()`."""

[[exercises]]
name = "errors2"
dir = "14_error_handling"
hint = """
The `catch` blocks are tried in order, and the first one that matches wins.
`std::invalid_argument` and `std::out_of_range` are derived from
`std::exception`, so the first handler catches them all. The compiler warns that
the later handlers can never be reached. Put the most specific handlers first."""

[[exercises]]
name = "errors3"
dir = "14_error_handling"
hint = """
An exception that isn't caught calls `std::terminate`, which aborts the program.
Wrap the code that can throw in `try { ... }` and add a
`catch (const std::invalid_argument& error) { ... }` block that prints a message.
Don't subtract any tokens when the input is invalid."""

[[exercises]]
name = "errors4"
dir = "14_error_handling"
hint = """
Check the value before constructing the object. An error is returned with
`std::unexpected(...)`:
    if (value < 0) {
        return std::unexpected(CreationError::Negative);
    }"""

[[exercises]]
name = "errors5"
dir = "14_error_handling"
hint = """
`parse_long(text)` returns a `std::expected<long, std::string>`. `and_then(f)`
calls `f` with the value only if there is one, and otherwise returns the error
unchanged. `f` must return an expected with the same error type, which
`PositiveNonzeroInteger::create` does:
    return parse_long(text).and_then(PositiveNonzeroInteger::create);"""

[[exercises]]
name = "errors6"
dir = "14_error_handling"
hint = """
`catch (std::exception error)` copies the caught exception into a new
`std::exception` object. Only the base part is copied ("object slicing"), so the
message of `InsufficientFunds` is lost. Catch by reference instead:
`catch (const std::exception& error)`."""

# TEMPLATES

[[exercises]]
name = "templates1"
dir = "15_templates"
hint = """
Put `template <typename T>` in front of the function and replace `int` with `T`.
The compiler deduces `T` from the arguments. Taking the parameters as
`const T&` avoids copying strings."""

[[exercises]]
name = "templates2"
dir = "15_templates"
hint = """
Put `template <typename T>` in front of the struct and use `T` as the type of
`value`. `Wrapper<int>` and `Wrapper<std::string>` are then two different types
generated from the same template."""

[[exercises]]
name = "templates3"
dir = "15_templates"
hint = """
A template can have a value parameter as well as type parameters:
    template <typename T, std::size_t N>
    T sum(const std::array<T, N>& values)
Start the total at `T{}`, which is zero for numbers."""

[[exercises]]
name = "templates4"
dir = "15_templates"
hint = """
Replace `if` with `if constexpr` (and `else if` with `else if constexpr`). The
condition must be known at compile time, which the type traits are. Branches
that aren't taken are discarded for that `T` and don't need to compile."""

# CONCEPTS AND POLYMORPHISM

[[exercises]]
name = "concepts1"
dir = "16_concepts"
hint = """
A `requires` expression lists expressions that must be valid for a type:
    template <typename T>
    concept Shape = requires(const T& shape) {
        { shape.area() } -> std::convertible_to<double>;
    };
The part after `->` additionally constrains the type of the expression."""

[[exercises]]
name = "concepts2"
dir = "16_concepts"
hint = """
Replace `typename` with a concept: `template <std::integral T>`.
Without the constraint, a call like `gcd(1.5, 2.5)` looks valid from the outside;
only the body fails to compile. With it, the call itself is rejected, and the
concept `HasGcd` in the test sees that."""

[[exercises]]
name = "concepts3"
dir = "16_concepts"
hint = """
Mark the base class function as `virtual`. Then the function of the actual
object's type is called, even through a base class reference or pointer. Mark
the function in the derived class with `override`."""

[[exercises]]
name = "concepts4"
dir = "16_concepts"
hint = """
`unique_ptr<Connection>` deletes the object through a `Connection*`. If the
destructor of `Connection` isn't virtual, only that destructor runs, and the one
of `DatabaseConnection` is skipped (formally, it's undefined behavior).
Make the base class destructor `virtual`."""

[[exercises]]
name = "concepts5"
dir = "16_concepts"
hint = """
`override` asks the compiler to check that the function really overrides a
virtual function of the base class. Here it doesn't: the base function is
`const`, the derived one isn't. So it's a new, unrelated function which hides the
base one. Add `const` to match the base signature."""

[[exercises]]
name = "quiz3"
dir = "quizzes"
hint = "No hints this time ;)"

# RAII AND LIFETIMES

[[exercises]]
name = "raii1"
dir = "17_raii"
hint = """
A destructor has the name of the class with a `~` in front, no parameters and no
return type:
    ~File() { ... }
It runs automatically when the object goes out of scope, also when the scope is
left because of an exception."""

[[exercises]]
name = "raii2"
dir = "17_raii"
hint = """
The copy constructor `Buffer(const Buffer& other)` allocates new memory and
copies the elements (`std::copy` from <algorithm>).
The copy assignment operator `Buffer& operator=(const Buffer& other)` must also
free the old memory. The copy-and-swap idiom handles that elegantly: take the
parameter by value (which copies it) and swap the members with it.
Alternatively, follow the rule of zero: store a `std::vector<int>` instead."""

[[exercises]]
name = "raii3"
dir = "17_raii"
hint = """
Replace `lock()` and `unlock()` with a lock guard at the beginning of the function:
    std::lock_guard lock(account_mutex);
Its constructor locks the mutex and its destructor unlocks it."""

[[exercises]]
name = "lifetimes1"
dir = "17_raii"
hint = """
Store the result in a `std::string`, which owns its characters. A
`std::string_view` is great for parameters, but it must never outlive the string
it looks at."""

[[exercises]]
name = "lifetimes2"
dir = "17_raii"
hint = """
`prefix_` refers to the local variable `prefix` of `make_logger`, which is
destroyed when `make_logger` returns. Store a `std::string` in the class instead
of a reference. Taking the constructor parameter by value and moving it into the
member avoids an extra copy."""

# TESTS

[[exercises]]
name = "tests1"
dir = "18_tests"
hint = """
`CHECK` expects a condition that should be true, e.g. `CHECK(is_even(4));`.
To check that something is false, negate it: `CHECK(!is_even(5));`."""

[[exercises]]
name = "tests2"
dir = "18_tests"
hint = """
`CHECK_EQ(actual, expected)` compares the result of a call with the value you
expect, e.g. `CHECK_EQ(power_of_2(3), 8u);`. If they differ, both values are
printed."""

[[exercises]]
name = "tests3"
dir = "18_tests"
hint = """
Use the member functions `width()` and `height()` in the first test.

For the other tests, the constructor throws, so the test itself would fail with
an unexpected exception. Wrap the construction in a check that expects it:
    CHECK_THROWS_AS(Rectangle(-10, 10), std::invalid_argument);"""

# MOVE SEMANTICS

[[exercises]]
name = "move_semantics1"
dir = "19_move_semantics"
hint = """
`std::move(vec0)` allows `fill_vec` to take over the elements of `vec0`, which is
left empty. If `vec0` is still needed afterwards, pass it without `std::move`:
the parameter is then initialized with a copy."""

[[exercises]]
name = "move_semantics2"
dir = "19_move_semantics"
hint = """
A `unique_ptr` is the single owner of its object, so it can't be copied, only
moved. Use `std::move` in both places: when calling `add`, and when pushing the
parameter into the vector. Afterwards, the moved-from pointer is null."""

[[exercises]]
name = "move_semantics3"
dir = "19_move_semantics"
hint = """
The move constructor takes an rvalue reference and moves each member:
    Buffer(Buffer&& other) noexcept : data_(std::move(other.data_)) {}
Write the move assignment operator the same way.

Without `noexcept`, the vector still copies its elements when it grows, because a
move that throws halfway would leave it broken."""

[[exercises]]
name = "move_semantics4"
dir = "19_move_semantics"
hint = """
Inside the function, `arg` is always an lvalue. `std::forward<Arg>(arg)` casts it
back to an rvalue only if the caller passed an rvalue ("perfect forwarding"):
    new T(std::forward<Arg>(arg))
`std::make_unique` works exactly like this, with any number of arguments."""

# SMART POINTERS

[[exercises]]
name = "unique_ptr1"
dir = "20_smart_pointers"
hint = """
Change the member to `std::unique_ptr<Node> next;`. The struct is then as big as
an int plus a pointer.

Build the list from the back: create the node 3, then the node 2 which owns node
3, then node 1. `std::make_unique<Node>(value, std::move(next))` creates a node.
A `unique_ptr` must be moved into the next node since it can't be copied."""

[[exercises]]
name = "unique_ptr2"
dir = "20_smart_pointers"
hint = """
Replace the raw pointer with `auto sensor = std::make_unique<Sensor>();` and
remove the `delete`. The unique_ptr deletes the sensor when it goes out of
scope, no matter which `return` is taken."""

[[exercises]]
name = "shared_ptr1"
dir = "20_smart_pointers"
hint = """
`std::make_shared<Sun>()` creates a new, separate sun. To share the existing one,
copy the `shared_ptr` `sun`, which increases its use count. When a copy is
destroyed or reset with `reset()`, the count goes down again."""

[[exercises]]
name = "weak_ptr1"
dir = "20_smart_pointers"
hint = """
Change the type of `parent` to `std::weak_ptr<TreeNode>`. A weak pointer doesn't
count as an owner, so the root is destroyed when the last `shared_ptr` to it is
gone, and the leaf after it.

A weak pointer can't be used directly. `node.parent.lock()` returns a
`shared_ptr` to the parent, which is empty if there is no parent."""

# LAMBDAS

[[exercises]]
name = "lambdas1"
dir = "21_lambdas"
hint = """
A lambda looks like a function without a name:
    [captures](parameters) { body }
For example: `[](int n) { return n * n; }`.
Put `limit` into the square brackets to capture it."""

[[exercises]]
name = "lambdas2"
dir = "21_lambdas"
hint = """
`[count]` copies `count` into the lambda; `mutable` only allows changing that
copy. Capture it by reference with `[&count]` instead.

For the second test, it's the other way around: `[&price]` always reads the
current value. Capture by value to keep the value from when the lambda was
created."""

[[exercises]]
name = "lambdas3"
dir = "21_lambdas"
hint = """
Return a lambda that captures `factor` by value: `[factor](int n) { ... }`. The
lambda is converted to `std::function<int(int)>` automatically.

Calling an empty `std::function` throws `std::bad_function_call`, which is what
the test reports right now."""

# ALGORITHMS AND RANGES

[[exercises]]
name = "algorithms1"
dir = "22_algorithms"
hint = """
The comparison lambda answers "does `a` come before `b`?". Oldest first means a
bigger age comes first: `a.age > b.age`. When the ages are equal, compare the
names instead."""

[[exercises]]
name = "algorithms2"
dir = "22_algorithms"
hint = """
`map | std::views::values` is a view of just the values of the map.
`std::ranges::count(range, value)` counts the elements equal to `value`. It
returns a difference type, so convert the result with `static_cast<int>`.

`std::transform_reduce(begin, end, init, reduce, transform)` calls `transform` on
every element and combines the results with `reduce`, starting from `init`:
    std::transform_reduce(collection.begin(), collection.end(), 0, std::plus{},
                          [value](const ProgressMap& map) { ... });"""

[[exercises]]
name = "algorithms3"
dir = "22_algorithms"
hint = """
`std::remove_if` works on iterators and can't change the size of the vector. It
moves the elements to keep to the front and returns an iterator to the new end;
the compiler warns that this return value is ignored. `std::erase_if(numbers,
predicate)` (C++20) removes the elements for real."""

[[exercises]]
name = "ranges1"
dir = "22_algorithms"
hint = """
For the first character: `static_cast<char>(std::toupper(static_cast<unsigned
char>(input.front())))`, then append `input.substr(1)`.

`words | std::views::transform(capitalize_first)` is a view of capitalized
words. `| std::ranges::to<std::vector>()` collects it into a vector.
`std::views::join` flattens a range of strings into a range of characters, which
can be collected with `std::ranges::to<std::string>()`."""

[[exercises]]
name = "ranges2"
dir = "22_algorithms"
hint = """
`std::views::iota(a, b)` is the range a, a+1, …, b-1. Both arguments should have
the same type, e.g. `std::uint64_t{1}` and `num + 1`.
`std::ranges::fold_left(range, init, op)` from <algorithm> combines all elements with `op`,
starting from `init`. `std::multiplies{}` multiplies two numbers.

For `even_squares`, chain the views with `|`. `std::views::take` expects a signed
count, so convert `limit` with `static_cast<std::ptrdiff_t>`."""

# THREADS

[[exercises]]
name = "threads1"
dir = "23_threads"
hint = """
Call `join()` on every thread in `handles` before reading `results`:
    for (std::thread& handle : handles) {
        handle.join();
    }"""

[[exercises]]
name = "threads2"
dir = "23_threads"
sanitizer = "thread"
hint = """
Add a `std::mutex mutex;` member to `Account`. At the beginning of `deposit`,
lock it for the rest of the function:
    std::lock_guard lock(account.mutex);
Then only one thread at a time can read and write the balance.

If ThreadSanitizer is available, cpplings uses it for this exercise and it
reports the data race even when the result happens to be right."""

[[exercises]]
name = "threads3"
dir = "23_threads"
hint = """
`wait` has an overload that takes a condition. It only sleeps while the condition
is false, and checks it again after every wake-up:
    queue_changed.wait(lock, [] { return !jobs.empty() || producer_done; });"""

# COMPILE-TIME PROGRAMMING

[[exercises]]
name = "macros1"
dir = "24_compile_time"
hint = """
The preprocessor replaces text: `SQUARE(1 + 2)` becomes `1 + 2 * 1 + 2`, which is
5. And `SQUARE(4) / SQUARE(2)` becomes `4 * 4 / 2 * 2`.
Put parentheses around every use of the parameter and around the whole
expansion: `((x) * (x))`."""

[[exercises]]
name = "macros2"
dir = "24_compile_time"
hint = """
`MAX(next_id(), 50)` expands to `((next_id()) > (50) ? (next_id()) : (50))`, so
`next_id()` runs twice. A function evaluates each argument once:
    template <typename T>
    constexpr T max_of(T a, T b) { return a > b ? a : b; }
Replace the uses of the macro with it."""

[[exercises]]
name = "constexpr1"
dir = "24_compile_time"
hint = """
`static_assert` and the size of a `std::array` need values known at compile
time. Mark the function `constexpr`. It can still be called at runtime with
values that are only known then, as in the last test."""

[[exercises]]
name = "constexpr2"
dir = "24_compile_time"
hint = """
Replace `constexpr` with `consteval`. Every call is now evaluated by the
compiler, and reaching the `throw` becomes a compiler error pointing at the bad
call. Admin panels often run on port 8080."""

# WARNINGS

[[exercises]]
name = "warnings1"
dir = "25_warnings"
strict = true
hint = """
`values.size()` is unsigned, while `i` is a signed `int`. Comparing them converts
the signed value to unsigned, which goes wrong for negative values. The simplest
fix avoids the index: `for (int value : values)`. Or use `std::size_t i`."""

[[exercises]]
name = "warnings2"
dir = "25_warnings"
strict = true
hint = """
Converting `double` to `long` cuts off the fractional part, so 1795.5 becomes
1795 instead of 1796. `std::lround` from <cmath> rounds to the nearest integer
and returns a `long`. The multiplication converts
`price_in_cents` to `double` implicitly, which `-Wconversion` also reports; write
`static_cast<double>(price_in_cents)`."""

[[exercises]]
name = "warnings3"
dir = "25_warnings"
strict = true
hint = """
Inside the constructor, the parameters `width` and `height` shadow the members, so
`width = width` assigns the parameter to itself and the member stays 0.
Initialize the members in a member initializer list and give them different
names, e.g. `width_`:
    Rectangle(int width, int height) : width_(width), height_(height) {}"""

[[exercises]]
name = "warnings4"
dir = "25_warnings"
strict = true
hint = """
`stock = 0` assigns 0 to `stock` and the condition is then false. The compiler
suggests extra parentheses to silence the warning when an assignment is
intended. Here a comparison was intended: `==`."""

# CONVERSIONS

[[exercises]]
name = "casts1"
dir = "26_conversions"
hint = """
In `total / values.size()`, the `int` is converted to the unsigned
`std::size_t`: -9 becomes 18446744073709551607. The division is an integer
division, too. Convert both operands to `double` first:
    static_cast<double>(total) / static_cast<double>(values.size())"""

[[exercises]]
name = "conversions1"
dir = "26_conversions"
hint = """
`text.find(',')` returns the position of the first comma or
`std::string_view::npos`. Check that there's no second comma with
`text.find(',', comma + 1)`. `substr` gives the parts before and after it.

`std::from_chars(first, last, value)` returns the position where parsing stopped
and an error code. Parsing succeeded if the error is `std::errc{}` and the whole
part was used.

Returning early from the constructor keeps the default values of the members.
Put `explicit` in front of the constructor."""

[[exercises]]
name = "conversions2"
dir = "26_conversions"
hint = """
A conversion operator has no return type in front; the type is its name:
    explicit operator double() const { ... }
Convert numerator and denominator to `double` before dividing.
`explicit operator bool() const` is still used automatically in conditions, and
by `!` and `&&`, but not in arithmetic or assignments."""
