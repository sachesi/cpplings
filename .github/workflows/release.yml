name: Release

# A release tag gets a GitHub release once CI has passed (ci.yml calls this). The tag
# must agree with the version in CMakeLists.txt; the notes list the fixes and features
# committed since the previous tag. The release carries cpplings built for Linux on
# x86_64 and aarch64, with the C++ runtime linked in so it runs on older distributions,
# and packages for Fedora, Debian, Ubuntu and Arch Linux. Run by hand, it publishes a
# tag pushed before this workflow existed.
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, such as v1.2.3
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  notes:
    name: Check the version and write the notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          # The notes need the history back to the previous tag.
          fetch-depth: 0
      - name: Check the version and write the notes
        run: |
          mkdir -p notes
          python3 - <<'EOF'
          import os, re, subprocess, sys

          tag = os.environ["TAG"]
          with open("CMakeLists.txt") as f:
              match = re.search(r"project\(cpplings VERSION ([0-9.]+)", f.read())
          if not match or match.group(1) != tag.removeprefix("v"):
              found = match.group(1) if match else "nothing"
              sys.exit(f"The tag is {tag}, but CMakeLists.txt says {found}")

          def git(*args):
              return subprocess.run(["git", *args], capture_output=True, text=True).stdout.strip()

          previous = git("describe", "--tags", "--abbrev=0", tag + "^")
          span = f"{previous}..{tag}" if previous else tag
          subjects = git("log", "--no-merges", "--format=%s", span).splitlines()
          picked = [s for s in subjects if re.match(r"(feat|fix|perf)(\(.*\))?!?:", s)] or [
              s for s in subjects if not re.match(r"(chore|ci)(\(.*\))?!?:", s)
          ]
          with open("notes/notes.md", "w") as f:
              f.write("\n".join(f"- {s}" for s in picked) + "\n")
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: notes
          path: notes/notes.md

  build:
    name: Build for ${{ matrix.arch }}
    needs: notes
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Install the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-14 cmake ninja-build
      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"
          cmake --build build
          strip build/cpplings
      - name: Check the binary
        env:
          CXX: g++-14
        run: |
          ./build/cpplings --version
          cd "$RUNNER_TEMP"
          echo | "$GITHUB_WORKSPACE/build/cpplings" init
          cd cpplings
          echo | "$GITHUB_WORKSPACE/build/cpplings" run intro1
      - name: Package
        run: |
          dir="cpplings-${TAG#v}-${{ matrix.arch }}-linux"
          mkdir -p "$dir" dist
          cp build/cpplings LICENSE README.md "$dir/"
          tar --sort=name --mtime="@$(git log -1 --format=%ct)" --owner=0 --group=0 --numeric-owner \
            -czf "dist/$dir.tar.gz" "$dir"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}
          path: dist/*

  fedora:
    name: Package for Fedora
    needs: notes
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install the tools
        run: dnf install -y --setopt=install_weak_deps=False git-core rpm-build dnf-plugins-core
      # The spec of this workflow's revision, which builds the tag's sources.
      - uses: actions/checkout@v4
      - name: Build
        run: |
          spec=packaging/fedora/cpplings.spec
          sed -i "s/^Version:.*/Version:        ${TAG#v}/; s/^Release:.*/Release:        1%{?dist}/" "$spec"
          dnf builddep -y --setopt=install_weak_deps=False "$spec"
          # rpmbuild fetches Source0 from the tag into a directory it does not create itself.
          mkdir -p rpmbuild/SOURCES
          rpmbuild -bb --define "_topdir $PWD/rpmbuild" --define "_disable_source_fetch 0" "$spec"
          mkdir dist
          find rpmbuild/RPMS -name '*.rpm' ! -name '*-debuginfo-*' ! -name '*-debugsource-*' -exec mv -t dist {} +
          # The dependencies resolve on the release it was built for.
          dnf install -y dist/*.rpm
          cpplings --version
      - uses: actions/upload-artifact@v4
        with:
          name: fedora
          path: dist/*

  debian:
    name: Package for ${{ matrix.name }}
    needs: notes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian
            image: debian:forky
            artifact: debian
            revision: "1"
          - name: Ubuntu 26.04
            image: ubuntu:26.04
            artifact: ubuntu
            revision: 1~ubuntu26.04
    container: ${{ matrix.image }}
    env:
      REVISION: ${{ matrix.revision }}
      DEBIAN_FRONTEND: noninteractive
    defaults:
      run:
        # Not the image's sh, which is dash.
        shell: bash
    steps:
      - name: Install the build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git dpkg-dev g++ cmake
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build
          DESTDIR="$PWD/stage" cmake --install build
          install -Dm644 LICENSE stage/usr/share/doc/cpplings/copyright
          install -Dm644 README.md -t stage/usr/share/doc/cpplings
      - name: Package
        run: |
          strip --strip-unneeded stage/usr/bin/cpplings
          # dpkg-shlibdeps wants a source package to belong to.
          mkdir debian
          printf 'Source: cpplings\n\nPackage: cpplings\nArchitecture: any\n' > debian/control
          shlibs=$(dpkg-shlibdeps -O -e stage/usr/bin/cpplings | sed -n 's/^shlibs:Depends=//p')
          arch=$(dpkg --print-architecture)
          mkdir stage/DEBIAN
          cat > stage/DEBIAN/control <<EOF
          Package: cpplings
          Version: ${TAG#v}-$REVISION
          Architecture: $arch
          Maintainer: sachesi <xsachesi@pm.me>
          Installed-Size: $(du -sk stage | cut -f1)
          Depends: $shlibs, g++
          Section: devel
          Priority: optional
          Homepage: https://github.com/sachesi/cpplings
          Description: Small exercises to get you used to reading and writing modern C++
           cpplings is a collection of small C++23 exercises in the style of
           Rustlings. Each exercise doesn't compile or fails its tests; you fix it in
           your editor while cpplings watches the file, reruns it on every save and
           moves you on once it passes.
          EOF
          mkdir dist
          deb="dist/cpplings_${TAG#v}-${REVISION}_$arch.deb"
          dpkg-deb --root-owner-group -Zxz --build stage "$deb"
          # The dependencies resolve on the release it was built for.
          apt-get install -y "./$deb"
          cpplings --version
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  arch:
    name: Package for Arch Linux
    needs: notes
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      # The PKGBUILD of this workflow's revision, which builds the tag's sources.
      - uses: actions/checkout@v4
      - name: Build
        run: |
          pacman -Syu --noconfirm --needed git
          useradd -m builder
          install -d -o builder pkg
          cp packaging/arch/PKGBUILD pkg/
          sed -i "s/^pkgver=.*/pkgver=${TAG#v}/; s/^pkgrel=.*/pkgrel=1/" pkg/PKGBUILD
          (source pkg/PKGBUILD && pacman -S --noconfirm --needed --asdeps "${depends[@]}" "${makedepends[@]}")
          su builder -c 'cd pkg && makepkg --noconfirm'
          mkdir dist && mv pkg/"cpplings-${TAG#v}"-1-*.pkg.tar.zst dist/
          # The dependencies resolve on Arch as it is today.
          pacman -U --noconfirm dist/*.pkg.tar.zst
          cpplings --version
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: dist/*

  publish:
    name: Publish the release
    needs: [notes, build, fedora, debian, arch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: notes
          path: notes
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "{x86_64,aarch64,fedora,debian,ubuntu,arch}"
          merge-multiple: true
      - name: Publish
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          # A release that already exists keeps its notes, which may have been edited by hand.
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber *
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag --title "cpplings ${TAG#v}" \
              --notes-file ../notes/notes.md *
          fi
